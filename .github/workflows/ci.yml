name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Scripts carry PEP 723 metadata, so `uv run` provisions the interpreter
      # and PyYAML automatically — no separate dependency install needed.
      - name: Run test suite
        env:
          PY: ${{ matrix.python-version }}
        run: |
          uv run --python "$PY" scripts/test_risky_patterns.py
          uv run --python "$PY" scripts/validate_checkpoints.py
          uv run --python "$PY" scripts/test_eval_fixtures.py
