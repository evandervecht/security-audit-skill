name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # Scripts carry PEP 723 metadata, so `uv run` provisions the interpreter
      # and PyYAML automatically — no separate dependency install needed.
      - name: Run test suite
        env:
          PY: ${{ matrix.python-version }}
        run: |
          uv run --python "$PY" scripts/test_risky_patterns.py
          uv run --python "$PY" scripts/validate_checkpoints.py
          uv run --python "$PY" scripts/test_eval_fixtures.py
          uv run --python "$PY" scripts/test_skill_scan.py
